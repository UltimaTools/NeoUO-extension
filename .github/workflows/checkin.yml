name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate language assets
        run: make check-assets

      - name: Set development version
        if: github.event_name != 'release'
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.version=p.version.split('-')[0]+'-dev.${{ github.run_number }}';fs.writeFileSync('package.json',JSON.stringify(p,null,4)+'\n');console.log(p.version)"

      - name: Set release version from tag
        if: github.event_name == 'release'
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.version='${{ github.event.release.tag_name }}'.replace(/^v/,'');fs.writeFileSync('package.json',JSON.stringify(p,null,4)+'\n');console.log(p.version)"

      - name: Package extension
        run: npx --no-install vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.event_name == 'release' && 'release' || 'development' }}
          path: '*.vsix'

      - name: Publish to Marketplace (Trusted Publishing)
        if: github.event_name == 'release'
        run: npx --no-install vsce publish --oidc

      - name: Upload VSIX to Cloudflare R2
        if: github.event_name == 'release'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ]; then
            echo "::warning::R2 secrets are not configured; skipping VSIX upload."
            exit 0
          fi
          R2_BUCKET=neouo-releases
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          DEST="alpha/neouo-vscode-extension"
          VERSION=$(node -p "require('./package.json').version")
          VSIX="neouo-${VERSION}.vsix"
          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION=us-east-1
          aws s3 cp "${VSIX}" "s3://${R2_BUCKET}/${DEST}/${VSIX}" \
            --endpoint-url="${R2_ENDPOINT}" \
            --content-type "application/octet-stream"
          printf '{\n  "version": "%s",\n  "tag": "%s",\n  "filename": "%s",\n  "baseUrl": "https://releases.neouo.net/%s/",\n  "publishedAt": "%s"\n}\n' \
            "${VERSION}" "${{ github.event.release.tag_name }}" "${VSIX}" "${DEST}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest.json
          aws s3 cp latest.json "s3://${R2_BUCKET}/${DEST}/latest.json" \
            --endpoint-url="${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "no-cache"

      - name: Publish to Open VSX (optional)
        if: github.event_name == 'release'
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "::warning::OVSX_PAT is not configured; skipping Open VSX publish."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          npx --yes ovsx@1.3.0 publish "neouo-${VERSION}.vsix" -p "${OVSX_PAT}"

  attach-vsix:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-release
      - name: Attach VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" *.vsix --clobber --repo "${{ github.repository }}"
